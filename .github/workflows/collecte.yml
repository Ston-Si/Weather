name: Collecte quotidienne

on:
  schedule:
    - cron: "15 4 * * *"  # 4 h 15 UTC : 5 h 15 ou 6 h 15 à Paris
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      OWM_KEY: ${{ secrets.OWM_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      ACCUWEATHER_KEY: ${{ secrets.ACCUWEATHER_KEY }}
      TOMORROW_KEY: ${{ secrets.TOMORROW_KEY }}
      METEO_USER_AGENT: comparateur-meteo/1.0 (https://github.com/${{ github.repository }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover tests
      - run: python3 -m moteur.collecte
      - run: python3 -m moteur.observations
      - run: python3 -m moteur.scores
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data
          git diff --cached --quiet || git commit -m "Collecte du $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
